name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.7.2

  # ── Unit tests ──────────────────────────────────────────────────────────────
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: go test (unit)
        run: go test -race -v ./...

  # ── Integration tests — real Weaviate + contextionary ────────────────────────
  integration:
    name: Integration
    runs-on: ubuntu-latest

    services:
      weaviate:
        image: cr.weaviate.io/semitechnologies/weaviate:1.30.0
        ports:
          - "8080:8080"
        env:
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          DEFAULT_VECTORIZER_MODULE: text2vec-contextionary
          ENABLE_MODULES: text2vec-contextionary
          CONTEXTIONARY_URL: contextionary:9999
          CLUSTER_HOSTNAME: node1
          PERSISTENCE_DATA_PATH: /var/lib/weaviate
        options: >-
          --health-cmd "wget -qO- http://localhost:8080/v1/.well-known/ready || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      contextionary:
        image: cr.weaviate.io/semitechnologies/contextionary:en0.16.0-v1.2.1
        env:
          OCCURRENCE_WEIGHT_LINEAR_FACTOR: "0.75"
          EXTENSIONS_STORAGE_MODE: weaviate
          EXTENSIONS_STORAGE_ORIGIN: http://weaviate:8080
          NEIGHBOR_OCCURRENCE_IGNORE_PERCENTILE: "5"
          ENABLE_COMPOUND_SPLITTING: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Wait for Weaviate to be ready
        run: |
          echo "Waiting for Weaviate..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/v1/.well-known/ready; then
              echo "Weaviate is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Weaviate did not become ready in time"
          exit 1

      - name: go test (integration)
        env:
          WEAVIATE_HOST: localhost:8080
          WEAVIATE_MODULE: text2vec-contextionary
        run: go test -v -tags integration -timeout 120s ./...

  # ── Build ────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: go build
        run: go build -o weaviate-plugin .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: weaviate-plugin-linux-amd64
          path: weaviate-plugin
          retention-days: 7

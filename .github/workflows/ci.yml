name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.7.2

  # ── Unit tests ──────────────────────────────────────────────────────────────
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: go test (unit)
        run: go test -race -v ./...

  # ── Integration tests — real Weaviate + multilingual transformers ──────────
  integration:
    name: Integration
    runs-on: ubuntu-latest

    services:
      weaviate:
        image: cr.weaviate.io/semitechnologies/weaviate:1.30.0
        ports:
          - "8080:8080"
        env:
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          DEFAULT_VECTORIZER_MODULE: text2vec-transformers
          ENABLE_MODULES: text2vec-transformers
          TRANSFORMERS_INFERENCE_API: http://t2v-transformers:8080
          CLUSTER_HOSTNAME: node1
          PERSISTENCE_DATA_PATH: /var/lib/weaviate
        options: >-
          --health-cmd "wget -qO- http://localhost:8080/v1/.well-known/ready || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

      t2v-transformers:
        image: cr.weaviate.io/semitechnologies/transformers-inference:sentence-transformers-paraphrase-multilingual-MiniLM-L12-v2
        env:
          ENABLE_CUDA: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Wait for Weaviate to be ready
        run: |
          echo "Waiting for Weaviate..."
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8080/v1/.well-known/ready; then
              echo "Weaviate is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Weaviate did not become ready in time"
          exit 1

      - name: go test (integration)
        env:
          WEAVIATE_HOST: localhost:8080
          WEAVIATE_MODULE: text2vec-transformers
        run: go test -v -tags integration -timeout 120s ./...

  # ── Build ────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: go build
        run: go build -o weaviate-plugin .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: weaviate-plugin-linux-amd64
          path: weaviate-plugin
          retention-days: 7
